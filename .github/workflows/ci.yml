name: CI

# Pre-publish gate for dsh-trace-inspect: typecheck → test → build.
# Runs on every push / pull request against main.
#
# `lib/` is committed (the `github:` install path has no build step), so the
# build step is followed by a drift check: the committed output must equal a
# fresh build of src/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `lib/` is committed so a `github:` install needs no build step; this
      # step proves the committed halves still match src/.
      - name: Verify lib/ is up to date
        run: pnpm check:lib
